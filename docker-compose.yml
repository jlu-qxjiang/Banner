services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: banner-server:latest
    ports:
      - "8080:8080"
    networks:
      - banner
    environment:
      - PORT=8080
    # 运行时加固:只读根文件系统、丢弃所有 Linux 能力、禁止提权
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    image: banner-client:latest
    # 依赖 server 健康就绪后才启动(真实健康检测)
    depends_on:
      server:
        condition: service_healthy
    networks:
      - banner
    environment:
      - FINGERPRINT_SERVER=http://server:8080
    # 只读挂载本地 data 目录,供 client 读取输入文件
    volumes:
      - ./data:/data:ro
    command: ["-file", "/data/sample.json"]
    # 一次性任务,不重启
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

networks:
  # 内部网络,仅 server 对外暴露端口
  banner:
    driver: bridge
